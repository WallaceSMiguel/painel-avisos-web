<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Avisos</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<style>
  html,body{height:100%;margin:0}
  body{background:#0b0b0d;color:#f4f4f5;font-family:Inter,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
  img{width:96px;filter:drop-shadow(0 8px 24px rgba(255,90,10,.35))}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#b4b6ba;max-width:460px;line-height:1.5;margin:0 auto}
  code{color:#ff8a1f}
</style>
</head>
<body>
  <div>
    <img src="/static/img/logo-cubo.png" alt="">
    <h1>Acesso restrito</h1>
    <p>Esta tela precisa da chave de acesso. Abra o endereço completo da TV, que está no painel do administrador em <code>Configurações → Endereço da TV</code>.</p>
  </div>
  <script>setTimeout(function(){location.reload()},60000)</script>
</body>
</html>
