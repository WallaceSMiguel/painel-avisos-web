<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Leitor do Messenger</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; padding: 18px 20px; min-width: 340px; color: #222; }
  h1 { font-size: 17px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 13px; border: 1px solid #bbb; border-radius: 6px; }
  button { margin-top: 14px; padding: 8px 14px; font-size: 14px; border: 0; border-radius: 6px; background: #ff5a0a; color: #fff; cursor: pointer; }
  .status { margin-top: 14px; font-size: 13px; padding: 8px 10px; background: #f3f3f3; border-radius: 6px; }
  .ajuda { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Leitor do Messenger → Painel da TV</h1>
  <label for="url">Endereço do painel</label>
  <input id="url" placeholder="https://painelcorporativo.pythonanywhere.com">
  <label for="token">Token do leitor</label>
  <input id="token" type="password" placeholder="Admin → Atendimento → Token do leitor">
  <div class="ajuda">No painel: Admin → Atendimento → clique no olho e depois em copiar.</div>
  <label for="exibir">Nomes na TV</label>
  <select id="exibir">
    <option value="sim">Nome completo</option>
    <option value="primeiro_nome">Só o primeiro nome</option>
    <option value="nao">Sem nomes (só a quantidade)</option>
  </select>
  <button id="salvar">Salvar</button>
  <div class="status" id="status">…</div>
  <script src="config.js"></script>
  <script src="opcoes.js"></script>
</body>
</html>
